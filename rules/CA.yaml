country: CA
name: Canada
zones:
  - id: metro
    label: Cities (inside a Census Metropolitan Area or Census Agglomeration)
    description: Urban areas as defined by Statistics Canada, e.g. Toronto, Vancouver, Montréal, Calgary.
  - id: rest
    label: Rural Canada (outside CMAs and CAs)
rules:
  - id: ca-baseline
    title: No federal restriction outside the residential ban
    summary: Property that the residential ban does not cover can be bought by non-Canadians.
    applies_to: {}
    property_types: all
    verdict: ELIGIBLE
    sources:
      - title: CMHC — Prohibition on the Purchase of Residential Property by Non-Canadians Act
        url: https://www.cmhc-schl.gc.ca/professionals/housing-markets-data-and-research/housing-research/consultations/prohibition-purchase-residential-property-non-canadians-act
    source_type: regulator
    last_verified: 2026-10-29
    notes: >-
      The ban only covers buildings with 1-3 dwelling units (including condos and semi-detached
      houses). Buildings with more units and vacant land zoned residential or mixed use (exempted
      by 2023 amendments) fall outside it.

  - id: ca-residential-ban-nonresident
    title: Foreign buyer ban (non-residents)
    summary: >-
      Non-Canadians cannot buy residential property (1-3 dwelling units, including condos)
      inside Census Metropolitan Areas and Census Agglomerations.
    applies_to:
      status_in: [non_resident]
      special_none: [CA_REGISTERED_INDIAN]
    property_types: [house, apartment, new_build]
    zones: [metro]
    verdict: NOT_ELIGIBLE
    effective_from: 2023-01-01
    effective_to: 2027-01-01
    sources: &ca-ban-sources
      - title: CMHC — Prohibition on the Purchase of Residential Property by Non-Canadians Act
        url: https://www.cmhc-schl.gc.ca/professionals/housing-markets-data-and-research/housing-research/consultations/prohibition-purchase-residential-property-non-canadians-act
      - title: McCarthy Tétrault — two-year extension to 1 January 2027
        url: https://www.mccarthy.ca/en/insights/blogs/lay-land/two-year-extension-prohibition-purchase-residential-property-non-canadians
    source_type: regulator
    last_verified: 2026-10-29
    notes: Violators and anyone who knowingly helps them can be fined up to CAD 10,000.

  - id: ca-residential-ban-temporary-resident
    title: Foreign buyer ban (temporary residents)
    summary: >-
      Temporary residents are covered by the ban but have narrow exceptions, mainly for
      work-permit holders.
    applies_to:
      status_in: [temporary_resident]
      special_none: [CA_REGISTERED_INDIAN]
    property_types: [house, apartment, new_build]
    zones: [metro]
    verdict: CONDITIONAL
    conditions:
      - kind: other
        text: >-
          Work-permit holders qualify if the permit has at least 183 days of validity left on the
          purchase date and they have not already bought a residential property in Canada. Some
          students and refugee claimants have separate exceptions.
    effective_from: 2023-01-01
    effective_to: 2027-01-01
    sources: *ca-ban-sources
    source_type: secondary
    last_verified: 2026-10-29

  - id: ca-residential-ban-expiry
    title: Ban expiry — what replaces it is not confirmed
    summary: >-
      The ban is due to expire on 1 January 2027. As of late September 2026 no extension, repeal
      or replacement had been announced. Reports said the government was considering an
      Australia-style rule for established homes.
    applies_to:
      status_in: [non_resident, temporary_resident]
      special_none: [CA_REGISTERED_INDIAN]
    property_types: [house, apartment, new_build]
    zones: [metro]
    verdict: UNKNOWN
    effective_from: 2027-01-01
    sources:
      - title: MPA — Canada's foreign buyer ban is expiring
        url: https://www.mpamag.com/ca/mortgage-industry/industry-trends/canadas-foreign-buyer-ban-is-expiring-what-comes-next-could-reshape-the-market/582215
    source_type: secondary
    last_verified: 2026-10-29

  - id: ca-provincial-farmland
    title: Provincial farmland ownership limits
    summary: >-
      Several provinces (e.g. Saskatchewan, Alberta, Manitoba, Québec, Prince Edward Island)
      limit how much farmland non-residents or non-Canadians can own.
    applies_to:
      status_in: [non_resident, temporary_resident]
    property_types: [agricultural_land]
    verdict: CONDITIONAL
    conditions:
      - kind: approval
        text: Depends on the province — acreage caps or approval from a provincial farmland board.
    sources: []
    source_type: general_knowledge
